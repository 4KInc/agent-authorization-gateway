<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="'DM Sans', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#6b6860"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#0d9488"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" fill="#fafaf8" rx="12"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1916" letter-spacing="-0.02em">Agent Authorization Gateway — System Architecture</text>
  <text x="550" y="58" text-anchor="middle" font-size="12" fill="#9c9889">Track 1: Build (Net-New Agents) · Google ADK + MCP + Cloud Run + Firestore</text>

  <!-- ========== USER ========== -->
  <rect x="30" y="90" width="140" height="60" rx="8" fill="#fff" stroke="#e8e6e1" filter="url(#shadow)"/>
  <text x="100" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1916">User / Client</text>
  <text x="100" y="134" text-anchor="middle" font-size="10" fill="#9c9889">Dashboard / API / Chat</text>

  <!-- ========== ORCHESTRATOR ========== -->
  <rect x="250" y="80" width="200" height="80" rx="10" fill="#fff" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
  <rect x="250" y="80" width="200" height="24" rx="10" fill="#0d9488"/>
  <rect x="250" y="94" width="200" height="10" fill="#0d9488"/>
  <text x="350" y="96" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">ORCHESTRATOR</text>
  <text x="350" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1916">ADK Root Agent</text>
  <text x="350" y="138" text-anchor="middle" font-size="10" fill="#9c9889">Gemini 2.5 Flash</text>
  <text x="350" y="150" text-anchor="middle" font-size="10" fill="#9c9889">Routes: data → Worker, security → Gateway</text>

  <!-- Arrow: User → Orchestrator -->
  <line x1="170" y1="120" x2="245" y2="120" stroke="#6b6860" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="207" y="113" text-anchor="middle" font-size="9" fill="#9c9889">request</text>

  <!-- ========== WORKER AGENT ========== -->
  <rect x="30" y="240" width="200" height="100" rx="10" fill="#fff" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="240" width="200" height="24" rx="10" fill="#d97706"/>
  <rect x="30" y="254" width="200" height="10" fill="#d97706"/>
  <text x="130" y="256" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">WORKER AGENT</text>
  <text x="130" y="282" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1916">Data Analytics Agent</text>
  <text x="130" y="298" text-anchor="middle" font-size="10" fill="#9c9889">ADK + Gemini 2.5 Flash</text>
  <text x="130" y="314" text-anchor="middle" font-size="10" fill="#6b6860">query_database, search_analytics</text>
  <text x="130" y="328" text-anchor="middle" font-size="10" fill="#6b6860">list_datasets</text>

  <!-- ========== GATEWAY AGENT ========== -->
  <rect x="310" y="240" width="220" height="100" rx="10" fill="#fff" stroke="#0d9488" stroke-width="2" filter="url(#shadow)"/>
  <rect x="310" y="240" width="220" height="24" rx="10" fill="#0d9488"/>
  <rect x="310" y="254" width="220" height="10" fill="#0d9488"/>
  <text x="420" y="256" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">GATEWAY AGENT</text>
  <text x="420" y="282" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1916">Authorization Gateway</text>
  <text x="420" y="298" text-anchor="middle" font-size="10" fill="#9c9889">ADK + Gemini 2.5 Flash</text>
  <text x="420" y="314" text-anchor="middle" font-size="10" fill="#6b6860">authorize_action, verify_receipt</text>
  <text x="420" y="328" text-anchor="middle" font-size="10" fill="#6b6860">get_chain_stats, get_public_key</text>

  <!-- Arrow: Orchestrator → Worker -->
  <path d="M300,160 L300,180 L130,180 L130,235" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="215" y="175" text-anchor="middle" font-size="9" fill="#d97706">transfer_to_agent</text>

  <!-- Arrow: Orchestrator → Gateway -->
  <path d="M400,160 L400,180 L420,180 L420,235" fill="none" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <text x="460" y="175" text-anchor="middle" font-size="9" fill="#0d9488">transfer_to_agent</text>

  <!-- ========== MCP CONNECTION ========== -->
  <rect x="155" y="278" width="80" height="22" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="195" y="293" text-anchor="middle" font-size="10" font-weight="600" fill="#d97706">MCP</text>

  <!-- Arrow: Worker → Gateway via MCP -->
  <line x1="235" y1="289" x2="305" y2="289" stroke="#d97706" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="270" y="282" text-anchor="middle" font-size="9" fill="#d97706">authorize</text>

  <!-- ========== POLICY ENGINE ========== -->
  <rect x="610" y="220" width="180" height="80" rx="10" fill="#fff" stroke="#e8e6e1" filter="url(#shadow)"/>
  <text x="700" y="248" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1916">Policy Engine</text>
  <text x="700" y="264" text-anchor="middle" font-size="10" fill="#9c9889">Deterministic rules</text>
  <text x="700" y="280" text-anchor="middle" font-size="10" fill="#6b6860">Action allowlist</text>
  <text x="700" y="292" text-anchor="middle" font-size="10" fill="#6b6860">Resource scope · Rate limits</text>

  <!-- Arrow: Gateway → Policy -->
  <line x1="530" y1="270" x2="605" y2="260" stroke="#6b6860" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="568" y="258" text-anchor="middle" font-size="9" fill="#9c9889">evaluate</text>

  <!-- ========== RECEIPT SIGNER ========== -->
  <rect x="610" y="330" width="180" height="70" rx="10" fill="#fff" stroke="#e8e6e1" filter="url(#shadow)"/>
  <text x="700" y="358" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1916">Receipt Signer</text>
  <text x="700" y="374" text-anchor="middle" font-size="10" fill="#9c9889">Ed25519 signatures</text>
  <text x="700" y="388" text-anchor="middle" font-size="10" fill="#6b6860">7-field canonical JSON · Hash chain</text>

  <!-- Arrow: Gateway → Receipt Signer -->
  <line x1="530" y1="310" x2="605" y2="350" stroke="#6b6860" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="568" y="340" text-anchor="middle" font-size="9" fill="#9c9889">sign</text>

  <!-- ========== TOKEN ISSUER ========== -->
  <rect x="610" y="430" width="180" height="60" rx="10" fill="#fff" stroke="#e8e6e1" filter="url(#shadow)"/>
  <text x="700" y="456" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1916">Token Issuer</text>
  <text x="700" y="472" text-anchor="middle" font-size="10" fill="#9c9889">JWT · HS256 · 60s TTL</text>
  <text x="700" y="484" text-anchor="middle" font-size="10" fill="#6b6860">Bound to action digest</text>

  <!-- Arrow: Gateway → Token -->
  <line x1="500" y1="340" x2="605" y2="450" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <text x="540" y="400" text-anchor="middle" font-size="9" fill="#0d9488">issue token</text>

  <!-- ========== FIRESTORE ========== -->
  <rect x="860" y="290" width="200" height="90" rx="10" fill="#fff" stroke="#e8e6e1" filter="url(#shadow)"/>
  <text x="960" y="318" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1916">Cloud Firestore</text>
  <text x="960" y="336" text-anchor="middle" font-size="10" fill="#9c9889">Receipt Chain Store</text>
  <text x="960" y="354" text-anchor="middle" font-size="10" fill="#6b6860">Receipts · Keys · Stats</text>
  <text x="960" y="368" text-anchor="middle" font-size="10" fill="#6b6860">Shared across all services</text>

  <!-- Arrow: Receipt Signer → Firestore -->
  <line x1="790" y1="360" x2="855" y2="345" stroke="#6b6860" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="823" y="345" text-anchor="middle" font-size="9" fill="#9c9889">persist</text>

  <!-- ========== MERKLE ANCHOR ========== -->
  <rect x="860" y="420" width="200" height="60" rx="10" fill="#fff" stroke="#e8e6e1" filter="url(#shadow)"/>
  <text x="960" y="448" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1916">Merkle Anchor</text>
  <text x="960" y="464" text-anchor="middle" font-size="10" fill="#9c9889">SHA-256 · RFC 6962</text>
  <text x="960" y="476" text-anchor="middle" font-size="10" fill="#6b6860">Batch tamper detection</text>

  <!-- Arrow: Receipt Signer → Merkle -->
  <line x1="790" y1="380" x2="855" y2="440" stroke="#6b6860" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========== VERIFICATION API ========== -->
  <rect x="310" y="430" width="220" height="70" rx="10" fill="#fff" stroke="#e8e6e1" filter="url(#shadow)"/>
  <text x="420" y="458" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1916">Verification API</text>
  <text x="420" y="474" text-anchor="middle" font-size="10" fill="#9c9889">POST /verify-receipt · POST /verify-chain</text>
  <text x="420" y="488" text-anchor="middle" font-size="10" fill="#6b6860">Independent — uses only public key</text>

  <!-- Arrow: Gateway → Verification -->
  <line x1="420" y1="340" x2="420" y2="425" stroke="#6b6860" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ========== PROTECTED RESOURCE ========== -->
  <rect x="30" y="430" width="200" height="70" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="130" y="458" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1916">Protected Resource</text>
  <text x="130" y="474" text-anchor="middle" font-size="10" fill="#9c9889">Database · API · Cloud Service</text>
  <text x="130" y="488" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="600">Requires scoped token</text>

  <!-- Arrow: Worker → Resource -->
  <line x1="130" y1="340" x2="130" y2="425" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="145" y="385" font-size="9" fill="#dc2626">execute with token</text>

  <!-- ========== CLOUD RUN BOUNDARY ========== -->
  <rect x="15" y="530" width="1070" height="50" rx="8" fill="#f5f4f0" stroke="#e8e6e1"/>
  <text x="550" y="552" text-anchor="middle" font-size="11" font-weight="600" fill="#6b6860">Google Cloud Run — 3 Services</text>
  <rect x="30" y="560" width="300" height="16" rx="4" fill="#0d9488"/>
  <text x="180" y="572" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">REST API + Dashboard (:8080)</text>
  <rect x="350" y="560" width="300" height="16" rx="4" fill="#d97706"/>
  <text x="500" y="572" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">MCP Server (:8080/mcp)</text>
  <rect x="670" y="560" width="300" height="16" rx="4" fill="#475569"/>
  <text x="820" y="572" text-anchor="middle" font-size="9" font-weight="600" fill="#fff">ADK Chat Agent (:8080)</text>

  <!-- ========== FLOW LEGEND ========== -->
  <rect x="15" y="600" width="1070" height="65" rx="8" fill="#fff" stroke="#e8e6e1"/>
  <text x="35" y="620" font-size="11" font-weight="700" fill="#1a1916">Authorization Flow</text>

  <circle cx="35" cy="640" r="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="37" y="644" text-anchor="middle" font-size="9" font-weight="700" fill="#d97706">1</text>
  <text x="52" y="644" font-size="10" fill="#6b6860">Worker declares intent via MCP</text>

  <circle cx="255" cy="640" r="10" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="257" y="644" text-anchor="middle" font-size="9" font-weight="700" fill="#0d9488">2</text>
  <text x="272" y="644" font-size="10" fill="#6b6860">Gateway evaluates policy</text>

  <circle cx="445" cy="640" r="10" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="447" y="644" text-anchor="middle" font-size="9" font-weight="700" fill="#0d9488">3</text>
  <text x="462" y="644" font-size="10" fill="#6b6860">Signs receipt + issues 60s token</text>

  <circle cx="660" cy="640" r="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="662" y="644" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">4</text>
  <text x="677" y="644" font-size="10" fill="#6b6860">Worker executes with scoped token</text>

  <circle cx="900" cy="640" r="10" fill="#f5f4f0" stroke="#6b6860"/>
  <text x="902" y="644" text-anchor="middle" font-size="9" font-weight="700" fill="#6b6860">5</text>
  <text x="917" y="644" font-size="10" fill="#6b6860">Receipt anchored in Merkle tree</text>
</svg>
